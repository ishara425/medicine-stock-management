name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Step 2: Setup Node.js v22 for Vite
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'   # Vite 7 requires 20+ or 22+

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      # Step 4: Get GitHub Id Token
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            return await github.actions.getIDToken()
          result-encoding: string

      # Step 5: Build the React app
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      # Step 6: Deploy to Azure Static Web Apps
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FOREST_062F3D800 }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""       # No backend in this workflow
          output_location: "dist" # Vite output
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
