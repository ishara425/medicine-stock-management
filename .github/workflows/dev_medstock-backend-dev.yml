# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - medstock-backend-dev

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'  # ✅ backend folder එකේ changes විතරක් trigger කරන්න
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        working-directory: ./backend  # ✅ backend folder එකේ run කරන්න
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend  # ✅ backend folder එක විතරක් upload කරන්න

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'medstock-backend-dev'
          slot-name: 'Production'
          package: .  # ✅ Download කළ backend files deploy කරනවා
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_67A81CB2F63A479581B725FC3A6B16E8 }}